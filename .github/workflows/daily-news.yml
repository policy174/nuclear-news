name: Daily Nuclear News

on:
  # 평일 06:35 KST 시작 → 검색·dedup·발송 끝나고 07:00 전후 도달
  # cron 형식: 분 시 일 월 요일 (UTC 기준)
  # 35 21 * * 0-4  →  일~목 21:35 UTC = 월~금 06:35 KST
  # 정각(:00) 회피 이유: GitHub Actions cron은 매시 정각에 큐 폭주로
  # 수십 분 지연되는 게 일상. 어중간한 분(:35)으로 옮기면 지연 거의 사라짐.
  schedule:
    - cron: '35 21 * * 0-4'
  # 수동 실행 버튼 (Actions 탭에서 누를 수 있음)
  workflow_dispatch:
    inputs:
      topic:
        description: '특정 토픽만 실행 (선택사항, 비우면 모든 weekly 토픽)'
        required: false
      include_biweekly:
        description: '격주 토픽 포함 여부'
        type: boolean
        default: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies (yt-dlp)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg (yt-dlp 자막 추출용)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Clone last30days skill
        run: |
          git clone --depth 1 https://github.com/mvanhorn/last30days-skill.git \
            $HOME/last30days-skill

      - name: Run news collection
        env:
          # 텔레그램 자격증명 (Repository Secrets에서 주입)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # X (선택사항 - Secrets에 없으면 X 검색 스킵)
          AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          CT0: ${{ secrets.X_CT0 }}
          # Gemini (선택사항 - 없으면 cross-topic dedup의 의미 단계 스킵, URL 단계만 적용)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          # 경로
          LAST30DAYS_SKILL_ROOT: /home/runner/last30days-skill/skills/last30days
          LAST30DAYS_SAVE_DIR: ${{ github.workspace }}/raw
          # 옵션
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_BIWEEKLY: ${{ github.event.inputs.include_biweekly }}
        run: |
          ARGS=""
          if [ -n "$INPUT_TOPIC" ]; then
            ARGS="--topic \"$INPUT_TOPIC\""
          fi
          if [ "$INPUT_BIWEEKLY" = "true" ]; then
            ARGS="$ARGS --include-biweekly"
          fi
          # 평소 실행 시: 격주 토픽도 자동 포함 (스크립트가 주차로 알아서 거름)
          if [ -z "$INPUT_TOPIC" ] && [ -z "$INPUT_BIWEEKLY" ]; then
            ARGS="--include-biweekly"
          fi
          echo "실행: python send_research.py $ARGS"
          eval "python send_research.py $ARGS"

      - name: Upload raw research files (디버깅용, 7일 보관)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-research-${{ github.run_number }}
          path: raw/*.md
          retention-days: 7
          if-no-files-found: ignore
