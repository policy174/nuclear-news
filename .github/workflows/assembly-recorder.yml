name: Assembly recorder (국감 자막 레코더)
# 폰 GitHub 앱 → Actions → 이 워크플로 → Run workflow. 생중계가 시작될 때까지 기다렸다가 붙는다.
# 한 run 은 5시간 45분에서 끊고(Actions 6시간 한도), chain 이 남아 있으면 자기 자신을 다시 띄운다.
# 10-22: 노트북 없이 돌도록 실시간 요약(live_post)·정회 정리본(draft)도 여기서 — Claude Max 토큰(CLAUDE_CODE_OAUTH_TOKEN) 사용, API 키 과금 없음.
on:
  schedule:
    - cron: '0 23 22 10 *'   # 10/23 08:00 KST 과방위 56
    - cron: '0 23 25 10 *'   # 10/26 08:00 KST 기노위 62
  workflow_dispatch:
    inputs:
      xcodes:
        description: '위원회 코드 JSON (산자중기위 55, 기후노동위 62, 과방위 56)'
        default: '["55","62","56"]'
      chain:
        description: '이어 돌릴 횟수 (2 = 최대 약 17시간)'
        default: '2'
      minutes:
        description: '한 run 녹화 분 (시험할 때만 줄임)'
        default: '345'
      live_to:
        description: '실시간 요약 발송처: summary(원자력 뉴스 채널) / ops(개인 대화, 시험) / off'
        default: 'off'
      primary:
        description: '1 = 클라우드가 주력(정회 미가공 자막·정리본 docx·메일도 여기서). PC 와 같이 돌 땐 0'
        default: '0'
permissions:
  contents: read
  actions: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      xcodes: ${{ steps.p.outputs.xcodes }}
      chain: ${{ steps.p.outputs.chain }}
      minutes: ${{ steps.p.outputs.minutes }}
      live_to: ${{ steps.p.outputs.live_to }}
      primary: ${{ steps.p.outputs.primary }}
    steps:
      - id: p
        env:
          EV: ${{ github.event_name }}
          IX: ${{ inputs.xcodes }}
          IC: ${{ inputs.chain }}
          IM: ${{ inputs.minutes }}
          IL: ${{ inputs.live_to }}
          IP: ${{ inputs.primary }}
        run: |
          if [ "$EV" = schedule ]; then
            case "$(TZ=Asia/Seoul date +%F)" in
              2026-10-23) X='["56"]' ;;
              2026-10-26) X='["62"]' ;;
              *) X='[]' ;;
            esac
            echo "xcodes=$X" >> $GITHUB_OUTPUT
            echo "chain=2" >> $GITHUB_OUTPUT; echo "minutes=345" >> $GITHUB_OUTPUT
            echo "live_to=summary" >> $GITHUB_OUTPUT; echo "primary=1" >> $GITHUB_OUTPUT
          else
            echo "xcodes=$IX" >> $GITHUB_OUTPUT; echo "chain=$IC" >> $GITHUB_OUTPUT; echo "minutes=$IM" >> $GITHUB_OUTPUT
            echo "live_to=${IL:-off}" >> $GITHUB_OUTPUT; echo "primary=${IP:-0}" >> $GITHUB_OUTPUT
          fi
  record:
    needs: plan
    if: ${{ needs.plan.outputs.xcodes != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false
      matrix:
        xcode: ${{ fromJSON(needs.plan.outputs.xcodes) }}
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
      TELEGRAM_SUMMARY_CHAT_ID: ${{ secrets.TELEGRAM_SUMMARY_CHAT_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AUDIT_LLM: claude          # 러너엔 Codex 백업이 없다
      CLOUD_PRIMARY: ${{ needs.plan.outputs.primary }}
      DRAFT_AUTO: ${{ needs.plan.outputs.primary == '1' && '1' || '0' }}
      LIVE_TO: ${{ needs.plan.outputs.live_to }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AUDIT_GEMINI_API_KEY: ${{ secrets.AUDIT_GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: audit_recorder
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests websocket-client "python-socketio[client]" python-docx
      - name: Claude 토큰 정리   # 10-22: 복사할 때 줄바꿈이 섞여 "Not logged in" — 공백 제거 후 다시 가림
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          T=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$T"
          echo "CLAUDE_CODE_OAUTH_TOKEN=$T" >> "$GITHUB_ENV"
      - name: claude CLI
        if: ${{ env.LIVE_TO != 'off' || env.CLOUD_PRIMARY == '1' }}
        run: |
          npm install -g -q @anthropic-ai/claude-code
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || echo "::warning::CLAUDE_CODE_OAUTH_TOKEN 비밀값 없음 — 요약 실패함"
          A=$(echo '응답은 OK 한 단어' | timeout 120 claude -p --setting-sources "" --strict-mcp-config --model haiku 2>&1); echo "시험 호출: $A"
          echo "$A" | grep -qi "ok" || echo "::warning::claude 시험 호출 실패: $A"
      - name: watch topics   # 우리 처 예상질의는 공개 저장소에 두지 않는다 — 비밀값에서 파일로
        working-directory: audit_recorder
        env:
          WT: ${{ secrets.WATCH_TOPICS_JSON }}
        run: '[ -n "$WT" ] && printf "%s" "$WT" > watch_topics.json || echo "예상질의 없음"'
      - name: record
        working-directory: audit_recorder
        run: |
          if [ "$LIVE_TO" != off ]; then
            (while true; do python live_post.py --to "$LIVE_TO"; echo "live_post 재시작"; sleep 10; done) >> live_post.log 2>&1 &
          fi
          timeout ${{ needs.plan.outputs.minutes }}m python recorder.py --xcode ${{ matrix.xcode }} || true
          sleep 60   # 마지막 질의 요약·정리본 발송이 끝날 시간
      - name: finish
        if: always()
        working-directory: audit_recorder
        run: |
          tail -50 live_post.log 2>/dev/null || true
          for d in 2026-국정감사/*/; do
            [ -f "$d/raw_events.jsonl" ] || continue
            python recorder.py --replay "$d/raw_events.jsonl"
            python recorder.py --send "$d/replay"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.xcode }}-${{ github.run_id }}
          path: |
            audit_recorder/2026-국정감사/
            audit_recorder/live_post.log
          if-no-files-found: ignore
  next:
    needs: [plan, record]
    if: ${{ !cancelled() && needs.plan.outputs.xcodes != '[]' && needs.plan.outputs.chain != '0' }}   # 취소하면 체인도 멈춘다
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run assembly-recorder.yml -R ${{ github.repository }} \
            -f xcodes='${{ needs.plan.outputs.xcodes }}' -f minutes='${{ needs.plan.outputs.minutes }}' \
            -f chain=$(( ${{ needs.plan.outputs.chain }} - 1 )) \
            -f live_to='${{ needs.plan.outputs.live_to }}' -f primary='${{ needs.plan.outputs.primary }}'
