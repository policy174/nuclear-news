name: Daily Brief (통합 일일 브리핑)

# 원자력뉴스봇 통합: news_bot(수집) + 소셜(last30days)을 카드 1개로 매일 발송.
# digest_bot / send_research(daily-news) / wnn 을 대체.

on:
  # 매일 07:25 KST = 22:25 UTC. GitHub Actions cron은 정시 근처일수록 큐 폭주로
  # 수~수십 분 지연됨 → 어중간한 분(:25)으로 옮겨 지연·편차 최소화.
  schedule:
    - cron: '25 22 * * *'
  workflow_dispatch:
    inputs:
      no_social:
        description: '소셜 수집 생략 (curated만)'
        type: boolean
        default: false

permissions:
  contents: write   # 발송 후 digest_queue.json(비운 상태) 커밋

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg (소셜 YouTube 자막용)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Clone last30days skill (소셜 수집용)
        run: |
          git clone --depth 1 https://github.com/mvanhorn/last30days-skill.git \
            $HOME/last30days-skill

      - name: Run daily brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          # X (선택 - 없으면 소셜 X 검색 스킵)
          AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          CT0: ${{ secrets.X_CT0 }}
          LAST30DAYS_SKILL_ROOT: /home/runner/last30days-skill/skills/last30days
          LAST30DAYS_SAVE_DIR: ${{ github.workspace }}/raw
          NO_SOCIAL: ${{ github.event.inputs.no_social }}
        run: |
          if [ "$NO_SOCIAL" = "true" ]; then
            python daily_brief.py
          else
            python daily_brief.py --with-social
          fi

      - name: Commit state (비운 큐)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digest_queue.json || true
          git commit -m "chore: clear digest queue (daily brief)" || echo "변경 없음"
          git push || echo "푸시 생략"
