name: Daily Brief (통합 일일 브리핑)

# 원자력뉴스봇 통합: news_bot(수집)이 쌓은 curated 큐를 국내/해외 카드 브리핑으로 발송.
# ※ 소셜(last30days)은 무겁고 타임아웃 위험이 있어 이 워크플로에선 제외 — curated(RSS) 중심.

on:
  # 매일 07:25 KST = 22:25 UTC. 정시 큐 폭주 회피용 :25 오프셋.
  schedule:
    - cron: '25 22 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 발송 후 digest_queue.json(비운 상태) 커밋

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python daily_brief.py

      - name: Commit state (비운 큐) — 충돌 시 재시도
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ "$(tr -d '[:space:]' < digest_queue.json)" = "[]" ]; then
              echo "큐 이미 비어있음"; exit 0
            fi
            echo "[]" > digest_queue.json
            git add digest_queue.json
            git commit -m "chore: clear digest queue (daily brief)"
            if git push origin HEAD:main; then echo "큐 비우기 성공"; exit 0; fi
            echo "push 충돌 — 재시도 $i/5"; sleep $((RANDOM % 8 + 4))
          done
          echo "!! 큐 비우기 5회 실패 (news_bot 3일 정리로 자동 회복)"
