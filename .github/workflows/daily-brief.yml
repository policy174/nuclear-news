name: Daily Brief (통합 일일 브리핑)

# 원자력뉴스봇 통합: news_bot(수집)이 쌓은 curated 큐를 국내/해외 카드 브리핑으로 발송.
# ※ 소셜(last30days)은 무겁고 타임아웃 위험이 있어 이 워크플로에선 제외 — curated(RSS) 중심.
#
# 발송 원자성 (outbox 패턴, 2026-07):
#   ① plan  — 선별→outbox.json(pending) 기록, 큐에서 발송분 hash 만 제거
#   ② claim push — outbox+큐를 발송 **전에** push. 실패하면 발송하지 않는다
#      (예전엔 발송 후 push 라 push 실패 시 다음날 통째 재발송·중복이 났음).
#      큐를 [] 로 덮지 않고 hash 단위로 지우므로, 그 사이 crawl 이 넣은 새 기사도 안전.
#   ③ send  — outbox 의 pending 브리핑만 발송 (재실행 시 sent 는 건너뜀 = 중복 억제)
#   ④ confirm push — 발송 결과·delivery_log 기록. 충돌 시 결과(outbox_result.json,
#      untracked 라 reset 에도 생존)를 재병합해 재시도.

on:
  # 예약 04:50 KST(19:50 UTC). **예약 시각이 곧 도착 시각이 아니다** — 여기서
  # GitHub cron 은 상시 지연된다. 2026-09-12 실측:
  #   브리핑 슬롯(22:25 UTC) n=10 → 106~123분 (평균 113, 편차 ±9 로 안정)
  #   크롤 슬롯              → 6~162분 (슬롯마다 제각각, 예측 불가)
  # 슬롯이 다르면 지연도 다르므로 **평균 역산은 새 슬롯에서 성립할 보장이 없다.**
  # 그래서 평균이 아니라 관측 최악(162분)으로 역산한다:
  #   04:50 + 162분(최악) + 18분(잡 시작→발송 실측) = 07:50  → SLA "08시 이전" 충족
  #   04:50 + 113분(평균) + 18분                     = 06:41
  # 이르게 오는 피해 < 늦게 오는 피해라는 판단(2026-09-12 사용자 결정).
  # 직전 예약 07:25 는 실제로는 09:14~09:22 시작 / 카드 ~09:40 이었다 —
  # '출근길에 이미 와 있다'가 아니라 이미 사무실이다. :50 은 정시 큐 혼잡 회피.
  # 조간 시드(07:15 도착)보다 이르지만, 09-12 에 잡 안의 크롤을 뺐으므로
  # 브리핑은 어차피 직전 수집을 하지 않는다 — 시드는 다음 크롤이 처리한다.
  # 재측정법: gh run list --workflow=daily-brief.yml --json startedAt,event 로
  # schedule 이벤트의 시작 시각을 예약 시각과 비교. 슬롯을 옮기면 다시 잴 것.
  # (cron 의 timezone 필드는 미검증 — UTC + 주석 환산이라는 현행 관례 유지.)
  schedule:
    - cron: '50 19 * * *'
  workflow_dispatch:
    inputs:
      force_audio:
        description: '오늘 오디오를 새 코드로 다시 생성'
        required: false
        type: boolean
        default: false
      audio_send:
        description: '재생성한 오디오를 텔레그램으로도 발송 (쿼터 소진으로 아침에 못 만든 날 구제용)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # outbox/큐/delivery_log 커밋

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    # 2026-08-03 정기 실행이 15분 벽에 걸려 취소됐다 — 스텝은 전부 성공한 뒤
    # 마지막 스모크가 끝나는 순간(15분 09초)이었다. Plan·trend·배포(TTS 포함)가
    # 각각 3~7분이라 15분은 여유가 없다.
    # 2026-08-14 전 이슈 오디오(8~10분) 확장: audio_brief.py 는 자체 상한
    # AUDIO_RUN_BUDGET_SEC(25분) 안에서 배송 3분을 예약하고 멈추므로,
    # 잡 상한은 선행 스텝(~6분)을 더해 35분 — Actions 강제종료로 부분 배송이
    # 불발되는 경로가 없다.
    # 45분 — 2026-09-08 실측: 429 폭풍 날 오디오 90초 재시도 중 35분 상한이
    # 잡을 죽여(exit 143) 배포·오디오·서사가 통째로 미실행. 버킷 분산이 본질
    # 수리이고 이건 안전 마진(크롤과 동일 값).
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # hourly crawl이 보존한 최신 임베딩을 웹 이슈 연결에도 사용한다.
      - name: Restore embeddings cache
        uses: actions/cache/restore@v4
        with:
          path: embeddings.json
          key: ${{ runner.os }}-nuclear-embeddings-daily-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nuclear-embeddings-

      # 오디오 브리핑 mp3 는 git 이 아니라 Actions 캐시에 산다 (embeddings 패턴).
      # 이전 산출물이 있어야 같은 날짜 재실행이 TTS 를 다시 부르지 않는다.
      - name: Restore audio cache
        uses: actions/cache/restore@v4
        with:
          path: web/public/data/audio
          key: ${{ runner.os }}-nuclens-audio-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nuclens-audio-

      # [2026-09-12 제거] '발송 직전 최신 수집'(Collect + Commit collected state)을
      # 여기서 돌리지 않는다. 9/08~9/12 닷새간 매일 이 잡이 45분 타임아웃으로
      # 살해됐다(exit: job exceeded 45m0s). 원인은 시간이 아니라 **쿼터 충돌**:
      # 잡 안에서 크롤을 돌리면 curation 이 Gemini 분당 버킷을 바닥내고, 그
      # 직후 같은 잡의 dedup·daily_brief·audio 가 같은 버킷을 다시 찾는다.
      # 실측 피해(09-12 로그): dedup 실패 → 중복 기사 전량 유지 / 투자 줄 누락 /
      # **보고서 추천 섹션 생략**(report_pick 미생성) / 오디오 6일 연속 미생성.
      # crawl.yml 주석이 경고하던 바로 그 겹침을, 크롤을 브리핑 잡 안에 넣어
      # 구조적으로 보장해 버린 것이다. 아침 기사는 KST 06:00 정기 크롤이 덮고,
      # 그 뒤 85분은 포기한다 — 그 85분을 얻자고 브리핑 생성 전체를 잃었다.
      # 되살리려면 **별도 워크플로 + 최소 30분 간격**이어야 한다(같은 잡 금지).
      - name: Backfill 21-day briefing embeddings
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_MODEL: gemini-embedding-2
        run: python embedding_pipeline.py --window-days 21 --max-new 150 --require-nonzero

      - name: Plan (선별 → outbox 작성 → 큐 정리)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python daily_brief.py --plan

      - name: Push claim (발송 전 커밋 — 실패 시 발송 중단)
        id: claim
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add outbox.json digest_queue.json
            if git diff --cached --quiet; then echo "변경 없음 (재실행/empty)"; exit 0; fi
            git commit -m "chore: daily brief claim"
            if git push origin HEAD:main; then echo "claim push 성공"; exit 0; fi
            echo "push 충돌 — 재시도 $i/5"
            # 오늘 outbox 를 보존한 채 최신 main 위에서 재계획 (plan 은 오늘 outbox 재사용 → Gemini 재호출 0)
            cp outbox.json /tmp/outbox.keep
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/outbox.keep outbox.json
            python daily_brief.py --plan
            sleep $((RANDOM % 8 + 4))
          done
          echo "!! claim push 5회 실패 → 발송하지 않음 (중복 방지). 큐는 origin 에 그대로 남아 내일 재시도."
          exit 1

      - name: Send (텔레그램 발송)
        id: send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_brief.py --send

      - name: Confirm (결과 병합 + delivery log) — 충돌 시 재시도
        if: always() && steps.claim.conclusion == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            python daily_brief.py --confirm
            git add outbox.json delivery_log.jsonl
            if git diff --cached --quiet; then echo "기록할 변경 없음"; exit 0; fi
            git commit -m "chore: daily brief confirm"
            if git push origin HEAD:main; then echo "confirm push 성공"; exit 0; fi
            echo "push 충돌 — 재시도 $i/5"
            git fetch origin main
            git reset --hard origin/main
            sleep $((RANDOM % 8 + 4))
          done
          echo "!! confirm push 5회 실패 — 발송 상태 미기록. 36h 창 안 재실행 시 중복 발송 가능성 (수동 확인 권장)"
          exit 1

      # 웹 트렌드 '흐름 해석' 생성 — 하루 1회, Gemini 호출 +1. 실패해도 브리핑엔 비치명.
      - name: Trend insights (웹 트렌드 흐름 해석)
        if: always() && steps.claim.conclusion == 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python trend_insights.py
            # daily_lead 실패는 비치명 — trend insights 커밋을 같이 죽이면 안 된다
            # (2026-08-02 실사고: 파일 부재 → git add pathspec 실패 → 스텝 사망)
            python daily_lead.py || echo "[lead] daily_lead 실패 — 비치명, 계속"
            git add trend_insights.json
            if [ -f daily_leads.json ]; then git add daily_leads.json; fi
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -m "chore: trend insights"
            if git push origin HEAD:main; then echo "insights push 성공"; exit 0; fi
            echo "push 충돌 — 재시도 $i/3"
            sleep $((RANDOM % 8 + 4))
          done
          echo "insights push 실패 — 비치명, 다음날 재시도"
          exit 0

      # GitHub ubuntu 러너에 ffmpeg 가 없다 (2026-08-04 실측 — 로컬엔 있어서
      # 로컬 검증이 못 잡았다). 오디오 mp3 변환 전용. 실패해도 비치명 —
      # audio_brief 가 ffmpeg 부재를 감지하고 스스로 스킵한다.
      - name: Install ffmpeg (오디오 브리핑용)
        if: always() && steps.claim.conclusion == 'success'
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || echo "ffmpeg 설치 실패 — 오디오 스킵 (비치명)"

      # 아침 브리핑·흐름 해석을 nuclens.pages.dev에 즉시 반영 (하루 1회 확정 배포)
      # 맨 끝 산출물 가드의 기준선 — Deploy 가 report_draft.py 를 돌리기 **전**의
      # 초안 보유 목록을 떠 둔다. Deploy 첫 줄이 `git reset --hard origin/main`
      # 이므로 기준선도 origin/main 에서 읽어야 같은 시점이 된다(워킹트리 아님).
      # 실패해도 비치명 — 기준선이 없으면 가드가 초안 검사만 SKIP 한다.
      - name: Snapshot draft baseline (산출물 가드 기준선)
        if: always() && steps.claim.conclusion == 'success'
        continue-on-error: true
        run: |
          git fetch origin main --quiet || true
          git show origin/main:report_drafts.json > "$RUNNER_TEMP/drafts_before.json" 2>/dev/null \
            || echo '{}' > "$RUNNER_TEMP/drafts_before.json"
          wc -c < "$RUNNER_TEMP/drafts_before.json" | xargs echo "[guard] 기준선 바이트:"

      - name: Deploy web to Cloudflare Pages
        id: deploy
        if: always() && steps.claim.conclusion == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.1-flash-tts-preview' }}
          # 버킷 맵 분산 (2026-09-08 장애: review·insight·audio 가 전부 flash-lite
          # 한 버킷에 몰려 분당 429 폭풍 → 오디오 재시도 중 잡 타임아웃 살해).
          # 무료 한도는 모델별 버킷 — 최대 소비자(review)와 오디오 대본을 각자
          # 전용 버킷으로. 결과 배치: 큐레이션 2.5-flash(+체인 2.5/3.5-lite) /
          # 리뷰 3.5-flash(스토리 서사와 공유 — 하루 4콜 수준이라 허용) /
          # 인사이트 2.5-flash-lite / 오디오 대본 3.6-flash.
          GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL || 'gemini-3.5-flash' }}
          # 오디오 대본은 3.x 금지 — 3.x 계열은 thinkingBudget=0 을 INVALID_ARGUMENT
          # 로 거부한다(실측 2026-09-08: 3.6-flash·3.5-flash-lite 둘 다 400).
          # 대본은 thinking 을 꺼야 하므로(예산 잠식, 2026-08-04 실사고) 2.5 계열만.
          # 리뷰가 3.5-flash 로 빠져나가 flash-lite 버킷은 이제 인사이트+대본뿐.
          GEMINI_SCRIPT_MODEL: ${{ vars.GEMINI_SCRIPT_MODEL || 'gemini-2.5-flash-lite' }}
          # 오디오 브리핑 텔레그램 발송용 (audio_brief.send_telegram_audio)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN 미설정 — 웹 배포 스킵"; exit 0; fi
          git fetch origin main && git reset --hard origin/main
          python web/build_data.py
          # 분당 한도 창을 넘긴다 — build_data 가 같은 키로 방금 여러 번
          # 호출하고 끝나서, 곧바로 붙는 오디오의 첫 요청이 그 창에 걸린다.
          # 2026-08-17 실측: 워크플로 안에서는 재시도 6회를 다 쓰고도 실패했는데
          # 같은 시각 build_data 없이 로컬에서 부르니 한 번에 성공했다.
          sleep 65
          # 오디오 브리핑 — build_data 산출물을 재료로 쓰므로 반드시 그 뒤,
          # 배포 전. 실패해도 배포는 계속한다 (오디오는 부가 기능).
          # 1차 실패 시 90초 뒤 한 번 더. build_data 가 방금 같은 무료 버킷을
          # 쓰고 끝나는데 오디오가 곧바로 이어 붙어서, 분당 한도면 여기서 풀린다.
          # 잡 예산 25분 중 실제 사용은 6분이라 여유가 있다. generate() 는 그날
          # mp3 가 이미 있으면 스킵하므로 성공한 날엔 sleep 을 안 탄다.
          # 일일 한도였다면 재시도도 실패하고, 로그의 '[gemini] 일일 한도 판정'
          # 한 줄이 어느 쪽이었는지 말해 준다.
          audio_args=""
          if [ "${{ inputs.force_audio }}" = "true" ]; then
            # 기본은 웹만 갱신(재발송 소음 방지). audio_send 를 켠 날만 텔레그램에도
            # 보낸다 — 아침에 쿼터로 못 만든 오디오를 낮에 구제하는 경로.
            audio_args="--force"
            if [ "${{ inputs.audio_send }}" != "true" ]; then
              audio_args="--force --no-send"
            fi
          fi
          python audio_brief.py $audio_args || {
            echo "[audio] 1차 실패 — 90초 뒤 1회 재시도"
            sleep 90
            python audio_brief.py $audio_args || echo "[audio] 재시도도 실패 — 비치명, 배포 계속"
          }
          # 보고 후보 개조식 초안 — 회차당 최대 3건, 쿼터 실패는 스스로 exit 0
          # (초안 없이 배포). 오디오 뒤에 두는 이유: build_data·오디오가 같은
          # 무료 버킷을 방금 썼고, 여기까지 오면 분당 창이 풀려 있다.
          python report_draft.py || echo "[report_draft] 실패 — 초안 없이 배포 계속"
          # 스토리 국면형 서사 — 전용 버킷(gemini-3.5-flash)이라 위와 쿼터 경합 0.
          python chronicle_narrative.py || echo "[chronicle_narrative] 실패 — 서사 없이 배포 계속"
          # 초안 캐시를 커밋해야 다음 회차가 같은 이슈를 다시 묻지 않는다.
          # push 실패는 비치명 — 캐시가 안 남으면 다음 회차가 재생성할 뿐이다.
          git add report_drafts.json chronicle_narratives.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: report draft cache"
            git push origin HEAD:main || echo "[report_draft] cache push 실패 — 비치명"
          fi
          npx --yes wrangler@4.123.0 pages deploy web/public --project-name=nuclens --branch=main --commit-dirty=true
          # 배포 후 라이브 스모크 (crawl.yml과 동일 기준)
          sleep 15
          base="https://nuclens.pages.dev"; cb=$(date +%s)
          count=$(curl -sf --max-time 30 "$base/data/news.json?cb=$cb" | python -c "import json,sys; print(len(json.load(sys.stdin)))") \
            || { echo "::error::스모크 실패 — news.json이 JSON이 아니거나 접근 불가"; exit 1; }
          [ "$count" -gt 0 ] || { echo "::error::스모크 실패 — 기사 0건"; exit 1; }
          echo "스모크 OK — 기사 ${count}건"

      # 오디오 산출물을 다음 배포(짝수시 crawl·deploy-web)가 복원할 수 있게 저장.
      # audio.json 이 있어야 저장한다 — 빈 디렉터리 저장은 경고만 남긴다.
      - name: Check audio cache
        if: always()
        id: audio-cache
        run: |
          if [ -f web/public/data/audio/audio.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save audio cache
        if: always() && steps.audio-cache.outputs.available == 'true'
        uses: actions/cache/save@v4
        with:
          path: web/public/data/audio
          key: ${{ runner.os }}-nuclens-audio-${{ github.run_id }}

      # 이슈 병합·KEEI 매칭 LLM 판정 캐시. 위 배포 스텝의 git reset --hard 뒤에
      # build_data 가 쓰기 때문에 여기서 따로 커밋해야 살아남는다.
      # 캐시가 없으면 빌드마다 같은 쌍을 다시 묻고(KEEI 는 최대 150쌍) 판정이
      # 흔들린다.
      - name: Commit issue review cache
        if: always()
        run: |
          # 파일별로 가드한다 — 한 파일이 없어서 git add 가 실패하면 나머지
          # 파일의 커밋까지 같이 죽는다(daily_leads.json 데드락과 같은 함정).
          # chronicles.json(스토리 원장)·agenda_log_snapshots.json 은 build_data 가
          # 쓰는 영속 파일 — 여기서 안 커밋하면 이 경로의 갱신분만 조용히 유실된다
          # (crawl.yml 커밋 루프에는 있는데 여기 빠져 있던 함정).
          for f in issue_llm_reviews.json keei_llm_matches.json issue_insights.json chronicles.json agenda_log_snapshots.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: issue review cache"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main || exit 0
            git rebase origin/main || { git rebase --abort || true; exit 0; }
          done
          echo "캐시 push 실패 — 비치명, 다음 빌드에서 재시도"

      # 하루 1회 실제 브라우저 렌더링 검증 — API 정상인데 app.js 오류로 화면만
      # 깨지는 경우(2026-08-01 빈 화면 사고 유형)를 잡는다. 브라우저 설치 비용
      # 때문에 hourly crawl이 아닌 여기서만 실행.
      - name: Render smoke (라이브 화면 검증)
        if: always() && steps.claim.conclusion == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "배포 미사용 — 렌더링 스모크 스킵"; exit 0; fi
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node web/tests/render_smoke.mjs

      # 산출물 검사 — 이 잡에서 **유일하게 continue-on-error 가 없는** 스텝이다.
      #
      # 왜 필요한가: 나머지 스텝이 전부 비치명이고 파이썬 쪽도 쿼터 실패를 삼켜
      # exit 0 한다. 그래서 9/08~9/12 닷새간 dedup·오디오·보고서 초안이 전부
      # 죽었는데 워크플로는 초록이었다. 조건식(failure()||cancelled())을 고쳐도
      # 이건 못 잡는다 — GitHub 는 exit 0 을 성공으로 보기 때문이다.
      # "스텝이 돌았는가"가 아니라 **"산출물이 생겼는가"**를 여기서 직접 본다.
      #
      # 여기서 exit 1 이 나야 아래 notify_failure 잡이 발화한다. 그 고리:
      #   산출물 없음 → 가드 exit 1 → brief 잡 실패 → notify_failure 발화 → 개인 DM
      # 오탐 방지 규칙은 tools/artifact_guard.py 머리말과 tests/test_artifact_guard.py 참조.
      - name: Artifact guard (산출물 검사)
        if: always() && steps.deploy.outcome == 'success'
        run: python tools/artifact_guard.py --baseline "$RUNNER_TEMP/drafts_before.json"

  # 실패·취소 알림을 **별도 잡**으로 뺀다. 죽는 잡 맨 아래에 알림 스텝을 붙이는
  # 건 "네가 죽으면 나한테 알려줘"를 죽는 쪽에 맡기는 구조다 — 하드 타임아웃으로
  # 러너가 종료되면 그 스텝도 같이 날아간다. 실제로 9/08~9/12 닷새간 brief 잡이
  # 매일 45분 타임아웃으로 취소됐는데 알림은 0건이었다(daily-brief 에는 애초에
  # failure() 스텝 자체가 없었고, crawl-watchdog 은 crawl.yml 만 감시한다).
  #
  # 의존성 0 으로 유지할 것 — telegram_send.py 는 순수 stdlib 다. **경보는 시스템에서
  # 가장 단순한 것이어야 한다**: 모든 게 망가진 날에도 이것만은 돌아야 한다.
  # cancelled() 를 반드시 포함한다 — 타임아웃은 failure 가 아니라 cancelled 다.
  notify_failure:
    needs: brief
    if: ${{ always() && (needs.brief.result == 'failure' || needs.brief.result == 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify (운영 알림 → 개인 DM)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
        run: |
          python3 telegram_send.py --ops --plain "⚠️ nuclens 아침 브리핑 실패 (${{ needs.brief.result }})

          워크플로: ${{ github.workflow }} #${{ github.run_number }}
          로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          cancelled 면 45분 타임아웃, failure 면 산출물 가드 또는 배포 실패입니다.
          로그에서 'Artifact guard' 스텝을 먼저 보세요."
