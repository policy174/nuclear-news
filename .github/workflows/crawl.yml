name: Nuclear news crawl

on:
  schedule:
    # 3시간 간격. 병목은 Actions 분(공개 저장소라 무료)이 아니라 **Gemini 무료
    # 키의 분당 한도**다. 크롤과 브리핑은 별개 워크플로라 서로의 호출을 모르고,
    # 프로세스 내 페이서로도 조율되지 않는다. 2026-08-17: 매시간 크롤과 40분짜리
    # 브리핑이 겹쳐 오디오 대본이 12분(6회 재시도 × 2모델)을 기다리고도 429였다.
    # 3시간 간격이라 크롤은 KST 06·09시 — 브리핑(08:05 예약, 지연 시 최대
    # ~09:15 시작)과 지연 긴 날 09시 크롤이 겹칠 수 있다. 겹치면 상태 커밋이
    # rebase 충돌할 수 있는데, Commit state 가 비치명으로 넘긴다(그 시각 상태만
    # 포기, 다음 크롤이 재수집). 공유 concurrency 그룹은 검토 후 기각 — 대기
    # 슬롯이 1개라 대기 중인 브리핑이 후속 크롤 dispatch 에 밀려 취소될 수 있다.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      fetch_publications:
        description: "발간물 수집 강제 실행 (시간 게이트 무시)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 막힌 실행이 기본 6시간 동안 다음 크롤을 막지 못하게 한다
    # 45분. 무료 티어 429 대기가 길어지면 news_bot 만 25분을 쓰는 날이 있고,
    # 30분 상한에서는 그 뒤 Deploy 스텝이 통째로 잘렸다(2026-08-21 2회 연속
    # cancelled → 사이트가 갱신 안 됨). 공개 저장소라 Actions 분은 무료다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # news_bot이 계산한 임베딩을 다음 실행과 웹 이슈 클러스터링에서 재사용한다.
      # 캐시는 immutable이므로 run_id별로 저장하고 최신 prefix를 복원한다.
      - name: Restore embeddings cache
        uses: actions/cache/restore@v4
        with:
          path: embeddings.json
          key: ${{ runner.os }}-nuclear-embeddings-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nuclear-embeddings-

      # 운영 콘솔(/admin)이 KV 에 쌓아 둔 판정을 내려받는다. 없거나 못 읽으면
      # 기본 설정(keywords.json)만으로 수집한다 — 비치명이되 조용하지는 않게,
      # 파일을 지우고 경고를 남긴다. news_bot 이 그 부재를 applied.json 에
      # overlay:"unavailable" 로 적어 콘솔이 '적용됨' 이라고 우기지 못한다.
      - name: Fetch admin judgments (KV)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KV_NAMESPACE_ID: 191ac97645b743b4a43688aa2781d43e
        run: |
          rm -f admin_overrides.json
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 미설정 — 콘솔 판정 없이 수집"
            exit 0
          fi
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$ADMIN_KV_NAMESPACE_ID/values/judgments"
          if curl -sf "$url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o admin_overrides.json; then
            echo "판정 $(python -c "import json;print(len(json.load(open('admin_overrides.json',encoding='utf-8')).get('entries',[])))" 2>/dev/null || echo '?')건 내려받음"
          else
            # 404 = 아직 아무도 판정을 누르지 않음(정상). 그 외는 경고.
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            rm -f admin_overrides.json
            if [ "$code" = "404" ]; then echo "저장된 판정 없음 — 기본 설정으로 수집";
            else echo "::warning::콘솔 판정 조회 실패(HTTP $code) — 기본 설정으로 수집"; fi
          fi

      - run: python news_bot.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          # 이메일 뉴스레터 수집 (선택 — 미설정 시 자동 스킵)
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}

      # 적용 장부를 KV 로 돌려보낸다 — 콘솔의 '적용됨 / 다음 수집부터' 배지 재료.
      # 정적 파일로 배포하지 않는 이유는 news_bot.ADMIN_APPLIED_FILE 주석 참고.
      - name: Publish admin applied ledger (KV)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KV_NAMESPACE_ID: 191ac97645b743b4a43688aa2781d43e
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ ! -f admin_applied.json ]; then exit 0; fi
          curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$ADMIN_KV_NAMESPACE_ID/values/applied" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "value=<admin_applied.json" -F metadata='{}' >/dev/null \
            && echo "적용 장부 게시" \
            || echo "::warning::적용 장부 게시 실패 — 콘솔 배지가 옛 상태를 보일 수 있음"

      # 수집 후보가 아니라 실제 최근 브리핑 기사 기준으로 21일 캐시를 백필한다.
      # API 장애 시 크롤 본체는 계속하고 웹은 로컬 후보 벡터로 안전하게 폴백한다.
      - name: Backfill 21-day briefing embeddings
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_MODEL: gemini-embedding-2
        run: python embedding_pipeline.py --window-days 21 --max-new 150 --require-nonzero

      - name: Check embeddings cache
        id: embeddings-cache
        run: |
          count=$(python -c "import json; from embedding_pipeline import cached_vector; p='embeddings.json'; d=json.load(open(p, encoding='utf-8')) if __import__('os').path.exists(p) else {}; print(sum(cached_vector(v) is not None for v in d.values()))")
          if [ "$count" -gt 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "임베딩 캐시 ${count}건"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "임베딩 캐시 0건 — 로컬 후보 벡터 + 제목·태그 fallback 사용"
          fi

      - name: Save embeddings cache
        if: steps.embeddings-cache.outputs.available == 'true'
        uses: actions/cache/save@v4
        with:
          path: embeddings.json
          key: ${{ runner.os }}-nuclear-embeddings-${{ github.run_id }}

      - name: Sync recent archive to policy web
        continue-on-error: true
        # policy_web_sync.py 는 별도 트랙(Supabase 웹)에서 준비 중 — 파일이 커밋되면
        # 자동 활성화. 없을 땐 스킵해 매시간 에러 표시로 진짜 장애가 묻히는 것을 방지.
        run: |
          if [ ! -f policy_web_sync.py ]; then echo "policy_web_sync.py 없음 — 스킵"; exit 0; fi
          python policy_web_sync.py --lookback-days 7
        env:
          POLICY_WEB_URL: ${{ vars.POLICY_WEB_URL }}
          POLICY_INGEST_TOKEN: ${{ secrets.POLICY_INGEST_TOKEN }}

      # 국제기구 발간물 수집 — 하루 1회. zero-LLM, 요청 소스당 1회.
      # "몇 시인가"가 아니라 "오늘 했는가"로 판단한다(--once-per-day). cron 지연으로
      # 특정 시각을 놓치면 그날 수집이 통째로 빠지는데, IAEA·EIA 는 RSS 최신
      # 40건만 노출하고 워터마크가 없어 그 사이 발간물이 영구 유실된다.
      # 이미 수집한 날은 즉시 리턴하므로 매시간 돌아도 HTTP 요청 0.
      # Pages 배포 예산 +0 — 다음 짝수시 배포·daily-brief 배포에 자연 반영.
      - name: Fetch publications (1일 1회)
        continue-on-error: true
        env:
          # 영문 제목의 한국어 해석용(배치 1회). 없으면 원문 제목으로 뜬다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          if [ "${{ inputs.fetch_publications }}" = "true" ]; then
            echo "dispatch 강제 실행"; python pubs_fetch.py
          else
            python pubs_fetch.py --once-per-day
          fi

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json curated.json digest_queue.json archive/
          if [ -f publications.json ]; then git add publications.json; fi
          # 크롤이 delivery_log.jsonl 에 남기는 진단 기록(큐레이션 유실·
          # open_question 게이트 사유)이 이 목록에 없어서 러너와 함께 버려지고
          # 있었다. 실측(2026-08-04): 커밋된 173건이 전부 발송 기록이고
          # record_type 이 붙은 줄은 0건 — 두 기능 다 도입 이후 한 줄도 안 남았다.
          if [ -f delivery_log.jsonl ]; then git add delivery_log.jsonl; fi
          # discovery 쿼리 상태(성과·냉각). 커밋 안 하면 매 시각 같은 쿼리를
          # 다시 던지고 헛도는 조합을 영영 못 재운다 — 캐시와 같은 함정이다.
          if [ -f discovery_state.json ]; then git add discovery_state.json; fi
          git diff --cached --quiet || git commit -m "chore: update bot state"
          # daily-brief 의 재시도 사다리(fetch + reset --hard + 재생성)는 여기 못
          # 쓴다 — 그쪽은 outbox.json 에서 다시 만들 수 있지만 크롤은 이미 Gemini
          # 호출을 마친 뒤라 reset 하면 이번 시각 수집이 통째로 사라진다.
          # append-only 로그는 .gitattributes 의 merge=union 이 받으므로 rebase 로
          # 얹는다(양쪽에서 추가된 줄이 둘 다 남는다).
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 충돌 — rebase 후 재시도 $i/5"
            git fetch origin main
            # 충돌은 대부분 브리핑(08:05+지연)과의 동시 실행 — 큐·sent 를 양쪽이
            # 같이 커밋해서다(2026-09-01 실사고). 이번 시각 상태를 포기해도
            # 다음 크롤이 같은 기사를 재수집·재커밋하므로 자기 치유된다.
            # 여기서 죽으면 뒤의 웹 배포까지 잘리고 실패 알림이 사용자를 깨운다.
            git rebase origin/main || {
              git rebase --abort
              echo "::warning::상태 커밋 rebase 충돌 — 이번 시각 상태 미커밋 (다음 크롤이 재수집)"
              exit 0
            }
            sleep $((RANDOM % 8 + 4))
          done
          echo "::warning::상태 push 5회 실패 — 이번 시각 상태 미커밋 (다음 크롤이 재수집)"
          exit 0

      # 오디오 브리핑 mp3 — daily-brief 가 만들고 Actions 캐시로만 산다. 복원
      # 없이 배포하면 오디오 없는 스냅샷이 라이브를 덮어 플레이어가 404 를 문다.
      # 읽기만 한다 — 캐시의 주인은 daily-brief.yml 이다 (embeddings 와 동일 규칙).
      - name: Restore audio cache
        uses: actions/cache/restore@v4
        with:
          path: web/public/data/audio
          key: ${{ runner.os }}-nuclens-audio-never-matches
          restore-keys: |
            ${{ runner.os }}-nuclens-audio-

      # nuclens.pages.dev 갱신 — 2시간 간격(짝수 UTC시)만 배포.
      # Pages 무료 티어 월 500회 제한: 매시간(720회/월)은 초과 → 짝수시(~360회/월)로 제한.
      # 시크릿 미설정이면 조용히 스킵 (크롤 본연 기능에 비치명).
      - name: Deploy web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 이슈 병합 회색지대 LLM 판정용. 없으면 판정을 못 해 '병합 안 함'으로
          # 떨어지고, 새 쌍은 daily-brief 빌드까지 최대 하루를 기다리게 된다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN 미설정 — 웹 배포 스킵"; exit 0; fi
          # 배포 간격은 '지금 몇 시인가'가 아니라 '마지막 배포 이후 얼마나
          # 지났나'로 잰다. 짝수시 판정은 cron 지연에 취약하다 — GitHub cron 은
          # 상시 밀리는데, 짝수시에 예약된 실행이 이 스텝에 홀수시로 도달하면
          # 건너뛰고, 그 다음 홀수시 실행도 건너뛴다. 그러면 배포가 통째로
          # 사라진다(2026-08-03 실측: 23:17 UTC 이후 4시간 배포 0회).
          # 라이브 meta.json 의 생성 시각을 보고 판단하므로 상태 파일이 필요 없다.
          MIN_GAP_MIN=105
          age=$(python - <<'PY'
          import json, time, urllib.request
          from datetime import datetime
          try:
              req = urllib.request.Request(
                  f"https://nuclens.pages.dev/data/meta.json?cb={int(time.time())}",
                  headers={"User-Agent": "nuclens-deploy-gate/1.0"})
              built = json.load(urllib.request.urlopen(req, timeout=20))["generated_at"]
              age = (datetime.now(datetime.fromisoformat(built).tzinfo)
                     - datetime.fromisoformat(built)).total_seconds() / 60
              print(int(age))
          except Exception:
              print(99999)  # 확인 실패 시엔 배포한다 — 낡은 사이트가 더 나쁘다
          PY
          )
          echo "마지막 배포로부터 ${age}분 경과 (최소 간격 ${MIN_GAP_MIN}분)"
          if [ "$age" -lt "$MIN_GAP_MIN" ]; then echo "간격 미달 — 배포 스킵"; exit 0; fi
          python web/build_data.py
          # 구운 데이터를 배포 **전에** 검사한다. deploy-web.yml 이 같은 검사를 하지만
          # 그건 화면 코드를 밀 때만 도는 빠른 경로다. 2026-08-15~17 Deploy web 이
          # 9연속 실패(과병합 클러스터)하는 동안에도 이 스텝은 같은 데이터를 조용히
          # 배포했다 — 게이트가 한쪽 경로만 지키면 게이트가 아니다.
          # 실패하면 배포를 건너뛴다: 낡은 사이트보다 틀린 사이트가 나쁘다.
          # 데이터 지표 게이트(추적률·주별 균형)는 여기서 끈다 — 여기는 데이터 품질을
          # 보는 자리가 아니라 배포하는 자리다(test_prototype.py SKIP_DATA_GATES 주석).
          ( cd web && NUCLENS_SKIP_DATA_GATES=1 python -m unittest discover -s tests )
          node web/tests/date_window.mjs
          node web/tests/report_format.mjs
          npx --yes wrangler@4.123.0 pages deploy web/public --project-name=nuclens --branch=main --commit-dirty=true

      # 이슈 병합 회색지대 LLM 판정 캐시. 커밋하지 않으면 빌드마다(하루 12회+)
      # 같은 쌍을 다시 물어보게 되고, 판정이 흔들리면 이슈 묶음도 같이 흔들린다.
      # 배포 스텝 뒤라 앞의 "Commit state" 에 실을 수 없어 별도 스텝으로 둔다.
      # 실패해도 크롤 본연 기능에 비치명이므로 항상 성공으로 끝낸다.
      - name: Commit issue review cache
        if: always()
        run: |
          # 파일별로 가드한다 — 한 파일이 없어서 git add 가 실패하면 나머지
          # 파일의 커밋까지 같이 죽는다(daily_leads.json 데드락과 같은 함정).
          for f in issue_llm_reviews.json keei_llm_matches.json issue_insights.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: issue review cache"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main || exit 0
            git rebase origin/main || { git rebase --abort || true; exit 0; }
          done
          echo "캐시 push 실패 — 비치명, 다음 빌드에서 재시도"

      # 배포 후 라이브 스모크 — "데이터는 올라갔는데 화면이 죽는" 사고(2026-08-01) 재발 감지.
      # 홀수시·시크릿 미설정으로 배포를 스킵한 경우엔 직전 배포본을 검사하게 되므로 무해.
      - name: Smoke test live site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "배포 미사용 — 스모크 스킵"; exit 0; fi
          sleep 15
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://nuclens.pages.dev/data/__missing__.json?cb=$(date +%s)")
          [ "$code" = "404" ] || { echo "::error::스모크 실패 — SPA 폴백 재발 의심 (미존재 파일이 $code 응답)"; exit 1; }
          python - <<'EOF'
          import json, sys, time, urllib.error, urllib.request
          base = "https://nuclens.pages.dev/data/"
          cb = f"?cb={int(time.time())}"
          # Cloudflare 는 기본 UA(Python-urllib/3.x)를 봇으로 보고 403 을 준다.
          # 같은 URL 이 curl 로는 200 인데 이 블록만 6종 전부 HTTPError 로 죽어
          # 스모크가 상시 실패하고 있었다(2026-08-02 규명). UA 를 명시한다.
          UA = {"User-Agent": "nuclens-smoke/1.0"}
          names = ["news.json", "briefings.json", "issues.json", "trend.json", "meta.json", "insights.json", "publications.json"]
          # 새로 추가된 파일은 첫 배포 전까지 라이브에 없다. 홀수시 실행은 배포를
          # 건너뛰고 '직전 배포본'을 검사하므로, 필수로 두면 병합 직후 한 번은
          # 무조건 빨갛게 뜬다. 빌드가 항상 생성한다는 보장은 웹 단위 테스트가
          # 이미 하고 있으므로 여기서는 404 만 눈감아 준다(형식 검사는 그대로).
          TOLERATE_MISSING = {"publications.json"}
          fails, data = [], {}
          for n in names:
              try:
                  req = urllib.request.Request(base + n + cb, headers=UA)
                  r = urllib.request.urlopen(req, timeout=30)
                  ct = r.headers.get("Content-Type", "")
                  if "json" not in ct:
                      fails.append(f"{n}: Content-Type={ct}")
                  data[n] = json.load(r)
              # 상태 코드를 남긴다. 예전엔 'HTTPError' 로만 찍혀 403 인지 404 인지
              # 알 수 없었고, 그래서 원인 파악이 늦었다.
              except urllib.error.HTTPError as e:
                  if e.code == 404 and n in TOLERATE_MISSING:
                      print(f"note: {n} 아직 배포 안 됨 (첫 배포 전) — 스킵")
                      continue
                  fails.append(f"{n}: HTTP {e.code}")
              except Exception as e:
                  fails.append(f"{n}: {type(e).__name__}")
          if not data.get("news.json"):
              fails.append("news.json 0건")
          m = data.get("meta.json") or {}
          b = data.get("briefings.json") or []
          if b and m and b[0].get("date") != m.get("latest_briefing_date"):
              fails.append(f"briefings[0].date({b[0].get('date')}) != meta({m.get('latest_briefing_date')})")
          if fails:
              print("::error::스모크 실패 — " + " | ".join(fails)); sys.exit(1)
          print(f"스모크 OK — 기사 {len(data['news.json'])}건, 최신 브리핑 {m.get('latest_briefing_date')}, JSON 6종 정상")
          EOF

      # 실패를 사람이 보는 곳으로 보낸다. Actions 탭은 아무도 안 본다 —
      # 2026-08-15~17 Deploy web 이 9번 연속 빨간 채로 이틀을 갔다.
      # 알림 자체가 실패해도 크롤 결과를 바꾸지 않는다(이미 실패한 잡이다).
      - name: Notify failure (원자력정책실 동향봇)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_send.py --plain "⚠️ nuclens 수집·배포 실패

          워크플로: ${{ github.workflow }} #${{ github.run_number }}
          로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          배포가 멈췄으므로 사이트는 직전 정상본이 떠 있습니다."
