name: Nuclear news crawl

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # news_bot이 계산한 임베딩을 다음 실행과 웹 이슈 클러스터링에서 재사용한다.
      # 캐시는 immutable이므로 run_id별로 저장하고 최신 prefix를 복원한다.
      - name: Restore embeddings cache
        uses: actions/cache/restore@v4
        with:
          path: embeddings.json
          key: ${{ runner.os }}-nuclear-embeddings-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nuclear-embeddings-

      - run: python news_bot.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          # 이메일 뉴스레터 수집 (선택 — 미설정 시 자동 스킵)
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}

      - name: Check embeddings cache
        id: embeddings-cache
        run: |
          if [ -s embeddings.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            count=$(python -c "import json; print(len(json.load(open('embeddings.json', encoding='utf-8'))))")
            echo "임베딩 캐시 ${count}건"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "임베딩 캐시 없음 — 제목·태그 fallback 사용"
          fi

      - name: Save embeddings cache
        if: steps.embeddings-cache.outputs.available == 'true'
        uses: actions/cache/save@v4
        with:
          path: embeddings.json
          key: ${{ runner.os }}-nuclear-embeddings-${{ github.run_id }}

      - name: Sync recent archive to policy web
        continue-on-error: true
        # policy_web_sync.py 는 별도 트랙(Supabase 웹)에서 준비 중 — 파일이 커밋되면
        # 자동 활성화. 없을 땐 스킵해 매시간 에러 표시로 진짜 장애가 묻히는 것을 방지.
        run: |
          if [ ! -f policy_web_sync.py ]; then echo "policy_web_sync.py 없음 — 스킵"; exit 0; fi
          python policy_web_sync.py --lookback-days 7
        env:
          POLICY_WEB_URL: ${{ vars.POLICY_WEB_URL }}
          POLICY_INGEST_TOKEN: ${{ secrets.POLICY_INGEST_TOKEN }}

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json curated.json digest_queue.json archive/
          git diff --cached --quiet || git commit -m "chore: update bot state"
          git push

      # nuclens.pages.dev 갱신 — 2시간 간격(짝수 UTC시)만 배포.
      # Pages 무료 티어 월 500회 제한: 매시간(720회/월)은 초과 → 짝수시(~360회/월)로 제한.
      # 시크릿 미설정이면 조용히 스킵 (크롤 본연 기능에 비치명).
      - name: Deploy web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN 미설정 — 웹 배포 스킵"; exit 0; fi
          if [ $(( $(date -u +%H) % 2 )) -ne 0 ]; then echo "홀수 UTC시 — 배포 스킵 (2시간 간격)"; exit 0; fi
          python web/build_data.py
          npx --yes wrangler@4 pages deploy web/public --project-name=nuclens --branch=main --commit-dirty=true

      # 배포 후 라이브 스모크 — "데이터는 올라갔는데 화면이 죽는" 사고(2026-08-01) 재발 감지.
      # 홀수시·시크릿 미설정으로 배포를 스킵한 경우엔 직전 배포본을 검사하게 되므로 무해.
      - name: Smoke test live site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "배포 미사용 — 스모크 스킵"; exit 0; fi
          sleep 15
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://nuclens.pages.dev/data/__missing__.json?cb=$(date +%s)")
          [ "$code" = "404" ] || { echo "::error::스모크 실패 — SPA 폴백 재발 의심 (미존재 파일이 $code 응답)"; exit 1; }
          python - <<'EOF'
          import json, sys, time, urllib.request
          base = "https://nuclens.pages.dev/data/"
          cb = f"?cb={int(time.time())}"
          names = ["news.json", "briefings.json", "issues.json", "trend.json", "meta.json", "insights.json"]
          fails, data = [], {}
          for n in names:
              try:
                  r = urllib.request.urlopen(base + n + cb, timeout=30)
                  ct = r.headers.get("Content-Type", "")
                  if "json" not in ct:
                      fails.append(f"{n}: Content-Type={ct}")
                  data[n] = json.load(r)
              except Exception as e:
                  fails.append(f"{n}: {type(e).__name__}")
          if not data.get("news.json"):
              fails.append("news.json 0건")
          m = data.get("meta.json") or {}
          b = data.get("briefings.json") or []
          if b and m and b[0].get("date") != m.get("latest_briefing_date"):
              fails.append(f"briefings[0].date({b[0].get('date')}) != meta({m.get('latest_briefing_date')})")
          if fails:
              print("::error::스모크 실패 — " + " | ".join(fails)); sys.exit(1)
          print(f"스모크 OK — 기사 {len(data['news.json'])}건, 최신 브리핑 {m.get('latest_briefing_date')}, JSON 6종 정상")
          EOF
