name: Nuclear news crawl

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      fetch_publications:
        description: "발간물 수집 강제 실행 (시간 게이트 무시)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # news_bot이 계산한 임베딩을 다음 실행과 웹 이슈 클러스터링에서 재사용한다.
      # 캐시는 immutable이므로 run_id별로 저장하고 최신 prefix를 복원한다.
      - name: Restore embeddings cache
        uses: actions/cache/restore@v4
        with:
          path: embeddings.json
          key: ${{ runner.os }}-nuclear-embeddings-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nuclear-embeddings-

      - run: python news_bot.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          # 이메일 뉴스레터 수집 (선택 — 미설정 시 자동 스킵)
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}

      # 수집 후보가 아니라 실제 최근 브리핑 기사 기준으로 21일 캐시를 백필한다.
      # API 장애 시 크롤 본체는 계속하고 웹은 로컬 후보 벡터로 안전하게 폴백한다.
      - name: Backfill 21-day briefing embeddings
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_MODEL: gemini-embedding-2
        run: python embedding_pipeline.py --window-days 21 --max-new 150 --require-nonzero

      - name: Check embeddings cache
        id: embeddings-cache
        run: |
          count=$(python -c "import json; from embedding_pipeline import cached_vector; p='embeddings.json'; d=json.load(open(p, encoding='utf-8')) if __import__('os').path.exists(p) else {}; print(sum(cached_vector(v) is not None for v in d.values()))")
          if [ "$count" -gt 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "임베딩 캐시 ${count}건"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "임베딩 캐시 0건 — 로컬 후보 벡터 + 제목·태그 fallback 사용"
          fi

      - name: Save embeddings cache
        if: steps.embeddings-cache.outputs.available == 'true'
        uses: actions/cache/save@v4
        with:
          path: embeddings.json
          key: ${{ runner.os }}-nuclear-embeddings-${{ github.run_id }}

      - name: Sync recent archive to policy web
        continue-on-error: true
        # policy_web_sync.py 는 별도 트랙(Supabase 웹)에서 준비 중 — 파일이 커밋되면
        # 자동 활성화. 없을 땐 스킵해 매시간 에러 표시로 진짜 장애가 묻히는 것을 방지.
        run: |
          if [ ! -f policy_web_sync.py ]; then echo "policy_web_sync.py 없음 — 스킵"; exit 0; fi
          python policy_web_sync.py --lookback-days 7
        env:
          POLICY_WEB_URL: ${{ vars.POLICY_WEB_URL }}
          POLICY_INGEST_TOKEN: ${{ secrets.POLICY_INGEST_TOKEN }}

      # 국제기구 발간물 수집 — 하루 1회(20 UTC = 05 KST). zero-LLM, 요청 소스당 1회.
      # 20시 크롤이 커밋하면 22 UTC 짝수시 배포·22:25 daily-brief 배포에 자연 반영 —
      # Pages 배포 예산 +0. 실패해도 크롤 본연 기능에 비치명.
      - name: Fetch publications (1일 1회)
        continue-on-error: true
        run: |
          if [ "$(date -u +%H)" != "20" ] && [ "${{ inputs.fetch_publications }}" != "true" ]; then
            echo "발간물 수집 시간 아님 — 스킵 (매일 20 UTC, dispatch 강제 가능)"; exit 0
          fi
          python pubs_fetch.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json curated.json digest_queue.json archive/
          if [ -f publications.json ]; then git add publications.json; fi
          git diff --cached --quiet || git commit -m "chore: update bot state"
          git push

      # nuclens.pages.dev 갱신 — 2시간 간격(짝수 UTC시)만 배포.
      # Pages 무료 티어 월 500회 제한: 매시간(720회/월)은 초과 → 짝수시(~360회/월)로 제한.
      # 시크릿 미설정이면 조용히 스킵 (크롤 본연 기능에 비치명).
      - name: Deploy web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 이슈 병합 회색지대 LLM 판정용. 없으면 판정을 못 해 '병합 안 함'으로
          # 떨어지고, 새 쌍은 daily-brief 빌드까지 최대 하루를 기다리게 된다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN 미설정 — 웹 배포 스킵"; exit 0; fi
          if [ $(( $(date -u +%H) % 2 )) -ne 0 ]; then echo "홀수 UTC시 — 배포 스킵 (2시간 간격)"; exit 0; fi
          python web/build_data.py
          npx --yes wrangler@4 pages deploy web/public --project-name=nuclens --branch=main --commit-dirty=true

      # 이슈 병합 회색지대 LLM 판정 캐시. 커밋하지 않으면 빌드마다(하루 12회+)
      # 같은 쌍을 다시 물어보게 되고, 판정이 흔들리면 이슈 묶음도 같이 흔들린다.
      # 배포 스텝 뒤라 앞의 "Commit state" 에 실을 수 없어 별도 스텝으로 둔다.
      # 실패해도 크롤 본연 기능에 비치명이므로 항상 성공으로 끝낸다.
      - name: Commit issue review cache
        if: always()
        run: |
          git add issue_llm_reviews.json || exit 0
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: issue review cache"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main || exit 0
            git rebase origin/main || { git rebase --abort || true; exit 0; }
          done
          echo "캐시 push 실패 — 비치명, 다음 빌드에서 재시도"

      # 배포 후 라이브 스모크 — "데이터는 올라갔는데 화면이 죽는" 사고(2026-08-01) 재발 감지.
      # 홀수시·시크릿 미설정으로 배포를 스킵한 경우엔 직전 배포본을 검사하게 되므로 무해.
      - name: Smoke test live site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "배포 미사용 — 스모크 스킵"; exit 0; fi
          sleep 15
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://nuclens.pages.dev/data/__missing__.json?cb=$(date +%s)")
          [ "$code" = "404" ] || { echo "::error::스모크 실패 — SPA 폴백 재발 의심 (미존재 파일이 $code 응답)"; exit 1; }
          python - <<'EOF'
          import json, sys, time, urllib.error, urllib.request
          base = "https://nuclens.pages.dev/data/"
          cb = f"?cb={int(time.time())}"
          # Cloudflare 는 기본 UA(Python-urllib/3.x)를 봇으로 보고 403 을 준다.
          # 같은 URL 이 curl 로는 200 인데 이 블록만 6종 전부 HTTPError 로 죽어
          # 스모크가 상시 실패하고 있었다(2026-08-02 규명). UA 를 명시한다.
          UA = {"User-Agent": "nuclens-smoke/1.0"}
          names = ["news.json", "briefings.json", "issues.json", "trend.json", "meta.json", "insights.json", "publications.json"]
          fails, data = [], {}
          for n in names:
              try:
                  req = urllib.request.Request(base + n + cb, headers=UA)
                  r = urllib.request.urlopen(req, timeout=30)
                  ct = r.headers.get("Content-Type", "")
                  if "json" not in ct:
                      fails.append(f"{n}: Content-Type={ct}")
                  data[n] = json.load(r)
              # 상태 코드를 남긴다. 예전엔 'HTTPError' 로만 찍혀 403 인지 404 인지
              # 알 수 없었고, 그래서 원인 파악이 늦었다.
              except urllib.error.HTTPError as e:
                  fails.append(f"{n}: HTTP {e.code}")
              except Exception as e:
                  fails.append(f"{n}: {type(e).__name__}")
          if not data.get("news.json"):
              fails.append("news.json 0건")
          m = data.get("meta.json") or {}
          b = data.get("briefings.json") or []
          if b and m and b[0].get("date") != m.get("latest_briefing_date"):
              fails.append(f"briefings[0].date({b[0].get('date')}) != meta({m.get('latest_briefing_date')})")
          if fails:
              print("::error::스모크 실패 — " + " | ".join(fails)); sys.exit(1)
          print(f"스모크 OK — 기사 {len(data['news.json'])}건, 최신 브리핑 {m.get('latest_briefing_date')}, JSON 6종 정상")
          EOF
