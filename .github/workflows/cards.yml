# 카드뉴스만 다시 만든다 — 아침 브리핑에서 카드가 빠진 날(쿼터 소진·렌더 실패) 수동으로.
# daily-brief 의 카드 스텝과 같은 스크립트를 쓴다. 텍스트 브리핑은 건드리지 않는다.
# 실행: Actions → "Cards (카드뉴스 재생성)" → date 비우면 outbox 의 오늘 날짜.
name: Cards (카드뉴스 재생성)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "브리핑 날짜 YYYY-MM-DD (비우면 outbox 의 날짜)"
        required: false
        default: ""
      send:
        description: "텔레그램 앨범도 보낸다"
        type: boolean
        default: true

concurrency:
  group: cards
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cards/package-lock.json
      - name: Install card renderer
        working-directory: cards
        run: npm ci

      # 사이트 순위(web/public/data/briefings.json)가 재료다 — 라이브에서 받는다.
      # build_data 를 다시 돌리면 쿼터를 또 쓴다.
      - name: Fetch live site ranking
        run: |
          mkdir -p web/public/data
          curl -fsS "https://nuclens.pages.dev/data/briefings.json?cb=$(date +%s)" -o web/public/data/briefings.json

      - name: Make cards
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then python make_cards.py --date "${{ inputs.date }}"; else python make_cards.py --force; fi

      - name: Send card album
        if: inputs.send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_album.py

      # 여기서 wrangler 로 직접 올리면 안 된다 — 이 잡에는 build_data 산출물(issue/·brief/·
      # data/)이 없어 Pages 가 라이브의 그 파일들을 지운다. 커밋 뒤 deploy-web 을 깨운다
      # (봇 push 는 워크플로를 못 깨우지만 workflow_dispatch API 호출은 된다).
      - name: Publish cards to site + commit
        run: |
          python publish_cards.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git add outbox.json web/public/cards
            if git diff --cached --quiet; then echo "기록할 변경 없음"; exit 0; fi
            git commit -m "chore: cards regenerated"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main && git reset --hard origin/main
            python publish_cards.py
          done
          echo "push 실패 — 카드 PNG 미게시"; exit 1

      - name: Trigger site deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml -R ${{ github.repository }}
