# 카드뉴스만 다시 만든다 — 아침 브리핑에서 카드가 빠진 날(쿼터 소진·렌더 실패) 수동으로.
# daily-brief 의 카드 스텝과 같은 스크립트를 쓴다. 텍스트 브리핑은 건드리지 않는다.
# 실행: Actions → "Cards (카드뉴스 재생성)" → date 비우면 outbox 의 오늘 날짜.
name: Cards (카드뉴스 재생성)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "브리핑 날짜 YYYY-MM-DD (비우면 outbox 의 날짜)"
        required: false
        default: ""
      send:
        description: "텔레그램 앨범도 보낸다"
        type: boolean
        default: true

concurrency:
  group: cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cards/package-lock.json
      - name: Install card renderer
        working-directory: cards
        run: npm ci

      # 사이트 순위(web/public/data/briefings.json)가 재료다 — 라이브에서 받는다.
      # build_data 를 다시 돌리면 쿼터를 또 쓴다.
      - name: Fetch live site ranking
        run: |
          mkdir -p web/public/data
          curl -fsS "https://nuclens.pages.dev/data/briefings.json?cb=$(date +%s)" -o web/public/data/briefings.json

      - name: Make cards
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then python make_cards.py --date "${{ inputs.date }}"; else python make_cards.py --force; fi

      - name: Send card album
        if: inputs.send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_album.py

      - name: Publish cards to site + deploy + commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python publish_cards.py
          # 봇 push 는 deploy-web 을 못 깨우므로 직접 올린다(web/public 은 라이브 데이터가 없어
          # 데이터 파일은 안 올라간다 — Pages 는 없는 파일을 지우므로 data 는 먼저 받아 둔다)
          mkdir -p web/public/data
          for f in news briefings issues trend meta insights publications scraps; do
            curl -fsS "https://nuclens.pages.dev/data/$f.json" -o "web/public/data/$f.json" || true
          done
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx --yes wrangler@4.123.0 pages deploy web/public --project-name=nuclens --branch=main --commit-dirty=true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git add outbox.json web/public/cards
            if git diff --cached --quiet; then echo "기록할 변경 없음"; exit 0; fi
            git commit -m "chore: cards regenerated"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main && git reset --hard origin/main
            python publish_cards.py
          done
          echo "push 실패 — 카드 PNG 미게시"; exit 1
