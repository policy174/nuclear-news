<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 설명 점검 · Nuclens</title>
<meta name="description" content="원전 정책 질문에 AI가 어떻게 답하는지 공식 자료와 대조한 기록">
<link rel="canonical" href="https://nuclens.pages.dev/ai-check/">
<meta name="robots" content="noindex">
<style>
@font-face{font-family:"Pretendard Variable";src:url("/fonts/pretendard/v1.3.9/PretendardVariable.subset.woff2") format("woff2-variations");font-weight:45 920;font-display:swap}
:root{--navy:#12294c;--navy2:#0b1c36;--paper:#eef1f4;--panel:#fff;--ink:#17233a;--ink2:#526079;--blue:#204a8f;--blue-w:#eaf0f8;--line:#d7dde6;--line2:#b8c2d0;--no:#8f2118;--no-w:#fbe7e4;--warn:#7a4708;--warn-w:#fbf0dd;--ok:#1b5d39;--ok-w:#e2f3e9;--gray:#4d5a6d;--gray-w:#e9edf2}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 "Pretendard Variable","Malgun Gothic",sans-serif;word-break:keep-all}
a{color:var(--blue)}.wrap{max-width:860px;margin:auto;padding:0 18px}
.top{background:var(--navy);color:#fff}.top .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}.top a{color:#fff;text-decoration:none;font-weight:700;letter-spacing:.02em}.top span{font-size:12px;color:#c7d3e4}
.head{background:var(--navy);color:#fff;padding:18px 0 28px}.head h1{margin:0;font-size:29px;line-height:1.28;font-weight:800;letter-spacing:-.03em}.head p{margin:9px 0 0;font-size:14.5px;color:#d3ddea;max-width:650px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.sum div{background:var(--navy2);border-radius:6px;padding:12px 13px}.sum b{display:block;font-size:26px;line-height:1.15;font-weight:750}.sum span{display:block;font-size:12.5px;color:#d3ddea;margin-top:3px;line-height:1.35}
section{padding:24px 0 4px}h2{font-size:20px;line-height:1.3;margin:0;font-weight:800;letter-spacing:-.02em;padding-top:9px;border-top:3px solid var(--navy)}.lede{font-size:13.5px;color:var(--ink2);margin:6px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-top:12px}
.sig{padding:14px 15px;display:grid;grid-template-columns:96px 1fr;gap:4px 12px;border-top:1px solid var(--line)}.sig:first-child{border:0}.sig time,.sig .k{font-size:12.5px;color:var(--ink2)}.sig b{font-weight:650}.sig p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.filters button{appearance:none;border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:40px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.filters button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
details.q{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-top:8px}details.q>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;gap:10px;align-items:flex-start}details.q>summary::-webkit-details-marker{display:none}.q .tt{flex:1;min-width:0}.q .tt b{display:block;font-weight:650;line-height:1.4}.q .tt small{display:block;margin-top:3px;font-size:12.5px;color:var(--ink2)}.q .ch{color:var(--ink2);font-size:13px;margin-top:2px}.q[open] .ch{transform:rotate(180deg)}
.st{flex:none;display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:40px;white-space:nowrap}.no{background:var(--no-w);color:var(--no)}.warn{background:var(--warn-w);color:var(--warn)}.ok{background:var(--ok-w);color:var(--ok)}.gray{background:var(--gray-w);color:var(--gray)}
.qb{padding:0 15px 15px}.box{background:var(--blue-w);border-radius:5px;padding:10px 12px;font-size:13.5px}.box b,.note b{display:block;font-size:11.5px;font-weight:700;color:var(--blue);margin-bottom:2px}.cmp{margin:10px 0 0;display:grid;grid-template-columns:70px 1fr;gap:5px 9px;font-size:13.5px}.cmp dt{font-weight:650;color:var(--ink2)}.cmp dd{margin:0}.note{margin:10px 0 0;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{font-size:12px;font-weight:650;color:var(--ink2);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2)}td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border:0}.scr{overflow-x:auto}.scr table{min-width:600px}.num{text-align:right;font-variant-numeric:tabular-nums}
.ex{padding:15px}.ex+.ex{border-top:1px solid var(--line)}.ex h3{margin:0 0 8px;font-size:16px;font-weight:700}.ex p{margin:0 0 7px;font-size:13.5px}.ex ul{margin:0 0 9px;padding-left:17px;font-size:13.5px}.ex li{margin:3px 0}.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tri div{background:var(--blue-w);border-radius:5px;padding:9px 10px;font-size:13px}.tri b{display:block;font-size:11.5px;color:var(--blue);font-weight:700;margin-bottom:2px}
.mut{color:var(--ink2)}.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-bottom:6px}.lg i{display:inline-block;width:14px;height:3px;margin-right:6px;vertical-align:middle}
details.n{border-top:1px solid var(--line)}details.n:first-child{border:0}details.n>summary{cursor:pointer;display:flex;justify-content:space-between;padding:11px 15px;list-style:none}details.n>summary::-webkit-details-marker{display:none}details.n b{font-variant-numeric:tabular-nums}details.n ul{margin:0;padding:0 15px 12px 31px;font-size:13.5px}details.n li{margin:4px 0}
.polls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pl{padding:13px 15px}.pl small{display:block;color:var(--ink2);font-size:12px}.pl div{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0;font-size:12.5px}.pl b{display:block;font-size:24px;font-weight:750;line-height:1.2}.pl a{font-size:12.5px}
.lim{margin:0;padding:12px 15px 12px 31px;font-size:13.5px;color:var(--ink2)}.lim li{margin:4px 0}.err{padding:16px;color:var(--no)}footer{padding:20px 0 42px;font-size:12px;color:var(--ink2)}
@media(max-width:620px){.polls{grid-template-columns:1fr}.head h1{font-size:25px}.sum b{font-size:22px}.sum div{padding:10px}.sum span{font-size:11.5px}.tri{grid-template-columns:1fr}.sig{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="wrap"><a href="/">Nuclens</a><span id="stamp"></span></div></div>
<header class="head"><div class="wrap"><h1>AI 설명 점검</h1><p>원전 정책 질문에 AI가 어떻게 답하는지 공식 자료와 대조합니다. 답변 차이는 확인할 단서이며 오류 판정이 아닙니다.</p><div class="sum" id="sum"></div></div></header>
<main class="wrap" id="app"><p class="lede" style="padding:20px 0">불러오는 중</p></main>
<footer class="wrap">개인 참고용 기록입니다. 공식 입장이 아니며, 인용 전 원문을 확인하세요.</footer>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CLS={"대조 문서와 불일치":"no","대조 문서에서 미확인":"warn","단정 수준 차이":"warn","대체로 일치":"ok","신규":"no","변화":"warn","기록":"gray"};
const stc=t=>`<span class="st ${CLS[t]||"gray"}">${esc(t)}</span>`;
const url=u=>/^https:\/\//.test(u||"")?esc(u):"#";
function qCard(i){return `<details class="q" data-g="${esc(i.group)}" data-t="${esc(i.tag)}"><summary>${stc(i.tag)}<span class="tt"><b>${esc(i.q)}</b><small>${esc(i.group)} · ${esc(i.note)}</small></span><span class="ch" aria-hidden="true">▼</span></summary><div class="qb"><div class="box"><b>공식 자료</b>${esc(i.official)}</div><dl class="cmp">${Object.entries(i.a).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>${i.latest?`<div class="note"><b>최근 조회 ${esc(i.latest.date)} · ${esc(i.latest.service)}</b>${stc(i.latest.tag)} ${esc(i.latest.summary)}${i.latest.why?` <span class="mut">${esc(i.latest.why)}</span>`:""}</div>`:""}</div></details>`}
function chart(s){const W=s.weeks,w=760,h=250,L=30,R=10,T=14,B=24,st=(w-L-R)/(W.length-1),x=i=>L+i*st,y=v=>T+(h-T-B)*(1-v/75),p=k=>W.map((d,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(d[k]).toFixed(1)}`).join("");const near=d=>W.reduce((b,e,i)=>e.date<=d?i:b,0);return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="주별 네이버 검색 지수" style="width:100%;height:auto;display:block">${[0,25,50,75].map(v=>`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" stroke="#d7dde6"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#526079">${v}</text>`).join("")}${s.events.map(e=>`<line x1="${x(near(e.date))}" x2="${x(near(e.date))}" y1="${T}" y2="${h-B}" stroke="#b8c2d0" stroke-dasharray="3 4"/>`).join("")}${W.filter((_,i)=>i%13===0).map(d=>`<text x="${x(W.indexOf(d))}" y="${h-6}" text-anchor="middle" font-size="12" fill="#526079">${esc(d.date.slice(2,7).replace("-","."))}</text>`).join("")}<path d="${p("nuke")}" fill="none" stroke="#204a8f" stroke-width="2.5"/><path d="${p("policy")}" fill="none" stroke="#b4541a" stroke-width="2.5"/></svg>`}
function heat(s){const L={남:"남성",여:"여성",대19_29:"19~29세",대30_39:"30대",대40_49:"40대",대50_59:"50대",대60:"60세 이상"};return `<table><tr><th></th>${s.names.map(n=>`<th>${esc(n)}</th>`).join("")}</tr>${Object.entries(s.shares).map(([k,v])=>`<tr><td>${esc(L[k]||k)}</td>${v.map(x=>`<td style="background:rgba(32,74,143,${(x/70).toFixed(2)});color:${x>=36?"#fff":"inherit"}">${x}%</td>`).join("")}</tr>`).join("")}</table>`}
function render(d){
 const all=d.questions,n=t=>all.filter(i=>i.tag===t).length;
 document.getElementById("stamp").textContent=`기준 ${d.as_of}`;
 document.getElementById("sum").innerHTML=`<div><b>${all.length}</b><span>점검 질문</span></div><div><b>${n("대조 문서와 불일치")}</b><span>대조 문서와 일치하지 않는 답이 나온 질문</span></div><div><b>${d.signals.filter(s=>s.level!=="기록").length}</b><span>새 특이 신호</span></div>`;
 const tags=["전체","대조 문서와 불일치","대조 문서에서 미확인","단정 수준 차이","대체로 일치"],gs=["공론화","고준위"];
 document.getElementById("app").innerHTML=`
 <section><h2>특이 신호</h2><p class="lede">${esc(d.signal_note)}</p><div class="panel">${d.signals.map(s=>`<div class="sig"><time>${esc(s.date)}</time><div>${stc(s.level)} ${s.url?`<a href="${url(s.url)}" target="_blank" rel="noopener noreferrer"><b>${esc(s.title)}</b></a>`:`<b>${esc(s.title)}</b>`}<p>${esc(s.detail)}</p></div></div>`).join("")}</div></section>
 <section><h2>질문별 대조</h2><p class="lede">질문을 누르면 공식 자료와 AI별 답변이 열립니다.</p><div class="filters" id="fg"><button data-g="" aria-pressed="true">전체 현안</button>${gs.map(g=>`<button data-g="${g}" aria-pressed="false">${g}</button>`).join("")}</div><div class="filters" id="ft">${tags.map((t,i)=>`<button data-t="${i?t:""}" aria-pressed="${!i}">${t}</button>`).join("")}</div><div id="qs">${all.map(qCard).join("")}</div></section>
 <section><h2>공식 기준값</h2><p class="lede">AI 답변을 대조할 때 쓰는 값입니다. 기준일과 포함 범위를 함께 봅니다.</p><div class="panel scr"><table><tr><th>항목</th><th>값</th><th>상태</th><th>출처</th></tr>${d.baseline.map(b=>`<tr><td>${esc(b.item)}</td><td>${esc(b.value)}</td><td>${esc(b.state)}</td><td>${esc(b.source)}</td></tr>`).join("")}</table></div></section>
 <section><h2>설명 근거 메모</h2><p class="lede">법령·초안에서 설명할 수 있는 것과 아직 말할 수 없는 것을 나눴습니다.</p><div class="panel">${d.explain.map(e=>`<article class="ex"><h3>${esc(e.q)}</h3><p>${esc(e.ours)}</p><ul>${e.abroad.map(a=>`<li><b>${esc(a.c)}</b> ${esc(a.t)} <a href="${url(a.u)}" target="_blank" rel="noopener noreferrer">원문</a></li>`).join("")}</ul><div class="tri"><div><b>설명 가능</b>${esc(e.can)}</div><div><b>아직 말할 수 없음</b>${esc(e.cannot)}</div><div><b>판단 필요</b>${esc(e.decide)}</div></div></article>`).join("")}</div></section>
 <section><h2>쟁점별 출처</h2><p class="lede">${esc(d.evidence_note)}</p><div class="panel scr"><table><tr><th>쟁점</th><th class="num">댓글</th><th class="num">기사 제목</th><th class="num">국감 발언</th></tr>${d.evidence.map(e=>`<tr><td>${esc(e.q)}</td><td class="num">${e.comments}</td><td class="num">${e.news}</td><td class="num">${e.audit}</td></tr>`).join("")}</table></div></section>
 <section><h2>최근 7일 쟁점별 기사</h2><p class="lede">${d.news&&d.news.rows.length?`nuclens 수집 기사 제목을 키워드로 나눈 수입니다. 한 기사가 여러 쟁점에 들어갈 수 있습니다. 기준 ${esc(d.news.as_of)}`:"다음 자동 갱신 때 표시됩니다."}</p>${d.news&&d.news.rows.length?`<div class="panel">${d.news.rows.map(r=>`<details class="n"><summary><span>${esc(r.name)}</span><b>${r.count}</b></summary><ul>${r.top.map(t=>`<li><a href="${url(t.u)}" target="_blank" rel="noopener noreferrer">${esc(t.t)}</a></li>`).join("")}</ul></details>`).join("")}</div>`:""}</section>
 <section><h2>검색 관심 추이</h2><p class="lede">네이버 데이터랩 지수(기간 내 최고값 100)입니다. 관심의 크기와 시기만 보여 주며 찬반을 뜻하지 않습니다. ${esc(d.search.snapshot)} 수집.</p><div class="panel" style="padding:12px"><div class="lg"><span><i style="background:#204a8f"></i>원전 관련 검색</span><span><i style="background:#b4541a"></i>신규원전·공론화 검색</span></div>${chart(d.search)}</div><div class="panel scr"><table><tr><th>사건</th><th>날짜</th><th class="num">원전</th><th class="num">신규원전·공론화</th></tr>${d.search.events.map(e=>`<tr><td>${esc(e.label)}</td><td>${esc(e.date)}</td><td class="num">${e.nuke}</td><td class="num">${e.policy}</td></tr>`).join("")}</table></div></section>
 <section><h2>누가 무엇을 찾나</h2><p class="lede">조건별로 5개 검색 묶음 안의 비중입니다. 조건 사이 검색량의 크기는 비교할 수 없습니다.</p><div class="panel scr">${heat(d.search)}</div></section>
 <section><h2>공표 여론조사</h2><p class="lede">같은 달 조사지만 문항과 조사 주체가 달라 직접 비교할 수 없습니다.</p><div class="polls">${d.polls.map(p=>`<div class="panel pl"><small>${esc(p.who)}</small><div>${p.vals.map(v=>`<span><b>${esc(v[0])}</b>${esc(v[1])}</span>`).join("")}</div><a href="${url(p.url)}" target="_blank" rel="noopener noreferrer">보도 원문</a></div>`).join("")}</div></section>
 <section><h2>일반 원전 질문 ${d.general.length}개</h2><p class="lede">전기요금, 건강, 건설 기간 등 고준위 밖의 질문입니다. 2026년 11월 4일 조회, 공식 자료 대조는 일부만 했습니다.</p>${d.general.map(g=>`<details class="q"><summary><span class="tt"><b>${esc(g.q)}</b><small>${esc(g.flag||"")}</small></span><span class="ch" aria-hidden="true">▼</span></summary><div class="qb"><dl class="cmp" style="margin-top:0"><dt>Bing</dt><dd>${esc(g.answer)}</dd>${Object.entries(g.compare||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>${g.note?`<p class="note"><b>차이</b>${esc(g.note)}</p>`:""}</div></details>`).join("")}</section>
 <section><h2>무엇이 달라지나</h2><p class="lede">발표 자료를 만드는 데서 끝내지 않고 그 설명이 어떻게 전달되는지까지 봅니다. 왼쪽 칸은 일반적 흐름입니다.</p><div class="panel scr"><table><tr><th>구분</th><th>지금까지 보는 것</th><th>더 보는 것</th></tr>${d.improve.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div></section>
 <section><h2>볼 때 주의할 점</h2><ul class="panel lim">${d.limits.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></section>`;
 let G="",T="";const apply=()=>document.querySelectorAll("details.q").forEach(e=>{e.hidden=(G&&e.dataset.g!==G)||(T&&e.dataset.t!==T)});
 const bind=(id,fn)=>document.getElementById(id).addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b);apply()});
 bind("fg",b=>G=b.dataset.g);bind("ft",b=>T=b.dataset.t);
}
fetch("data.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(render).catch(()=>{document.getElementById("app").innerHTML='<p class="err">자료를 불러오지 못했습니다. 잠시 후 다시 열어 주세요.</p>'});
</script>
</body>
</html>
