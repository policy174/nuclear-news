<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 보기 · Nuclens</title>
<meta name="description" content="nuclens 영상 브리핑 전편 · 카톡 영상 · 웅찌 만화">
<link rel="canonical" href="https://nuclens.pages.dev/shorts/">
<meta name="robots" content="noindex">
<style>
@font-face{font-family:"Pretendard Variable";
  src:url("/fonts/pretendard/v1.3.9/PretendardVariable.subset.woff2") format("woff2-variations");font-weight:45 920;font-display:swap}
:root{--navy:#12294C;--paper:#EEF1F4;--blue:#4FA3E3;--dim:#9FB3CC;--video:#F0C23C}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--navy);color:var(--paper);min-height:100vh;
  font-family:"Pretendard Variable","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center;
  padding:36px 16px 72px}
.wrap{width:100%;max-width:520px}
a{color:inherit}
.home{display:inline-flex;align-items:center;gap:9px;font-size:15px;font-weight:600;
  color:var(--blue);text-decoration:none;letter-spacing:.08em}
.rule{width:64px;height:5px;background:var(--blue);margin:24px 0 12px}
h1{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.28}
.lede{font-size:14px;color:var(--dim);margin-top:8px}
.list{list-style:none;margin-top:28px}
.ep{display:flex;gap:16px;padding:18px 0;border-top:1px solid rgba(255,255,255,.14);
  text-decoration:none}
.ep:last-child{border-bottom:1px solid rgba(255,255,255,.14)}
.thumb{flex:0 0 84px;width:84px;height:150px;border-radius:10px;overflow:hidden;
  background:#0b1830;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;
  border-radius:50%;background:var(--video);color:#20160a;display:flex;align-items:center;
  justify-content:center;font-size:14px;padding-left:2px}
.body{flex:1;min-width:0}
.series{font-size:13px;font-weight:700;color:var(--video);letter-spacing:.06em}
h2{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin-top:5px;word-break:keep-all}
.lead{font-size:14.5px;line-height:1.6;color:#C8D4E4;margin-top:7px;word-break:keep-all}
.meta{font-size:12.5px;color:var(--dim);margin-top:9px;letter-spacing:.02em}
.empty{margin-top:28px;font-size:15px;color:var(--dim)}
/* 탭 — 영상 브리핑 · 카톡 영상 · 웅찌 만화. 주소 끝(#chat·#comic)으로 바로 열린다. */
.tabs{display:flex;gap:6px;margin-top:24px;border-bottom:1px solid rgba(255,255,255,.14)}
.tab{appearance:none;background:none;border:0;color:var(--dim);font:inherit;font-size:15px;
  font-weight:700;padding:10px 4px 12px;margin-right:14px;cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--video)}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.panel[hidden]{display:none}
.feature{margin-top:24px}
.feature h2{margin-top:6px}
.sheet{display:block;width:calc(100% + 32px);margin:8px -16px 0;min-height:80vh;border:0;
  background:var(--navy)}
.player{display:block;width:100%;max-width:360px;aspect-ratio:9/16;margin:16px auto 0;
  border-radius:14px;background:#0b1830}
.comic{display:block;width:100%;min-height:70vh;border:0;margin-top:16px;border-radius:14px;
  background:#fff}
.open{display:inline-block;margin-top:12px;font-size:14px;font-weight:600;color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="/">← NUCLENS</a>
  <div class="rule"></div>
  <h1>영상 보기</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-brief" aria-controls="panel-brief" data-hash="">영상 브리핑</button>
    <button class="tab" role="tab" id="tab-chat" aria-controls="panel-chat" data-hash="chat">카톡 영상</button>
    <button class="tab" role="tab" id="tab-comic" aria-controls="panel-comic" data-hash="comic">웅찌 만화</button>
  </div>

  <section class="panel" id="panel-brief" role="tabpanel" aria-labelledby="tab-brief">
    <p class="lede" id="briefLede" style="margin-top:16px">원자력 현안을 1분 안팎 영상으로. 최신 편이 맨 위.</p>
    <!-- 최신 편 공유 페이지(/shorts/<page>/)를 그대로 띄운다. src 는 index.json 을 읽고 채운다. -->
    <iframe class="sheet" id="briefFrame" hidden></iframe>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden>아직 올라온 영상이 없습니다.</p>
  </section>

  <section class="panel" id="panel-chat" role="tabpanel" aria-labelledby="tab-chat" hidden>
    <div class="feature">
      <p class="series">카톡 영상</p>
      <h2>66원? 잠깐만 · 민지와의 대화</h2>
      <p class="meta">2026. 10. 13. · 2분 44초</p>
      <!-- preload=none: 22MB — 탭을 열고 재생을 눌러야 받는다 -->
      <video class="player" controls playsinline preload="none"
             poster="/shorts/2026-10-13-chat-66won.jpg">
        <source src="/shorts/2026-10-13-chat-66won.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <section class="panel" id="panel-comic" role="tabpanel" aria-labelledby="tab-comic" hidden>
    <div class="feature">
      <p class="series">웅찌 만화</p>
      <h2>66원 사건 · 웅찌 탐정과 파란 새</h2>
      <a class="open" href="/shorts/detective/" target="_blank" rel="noopener">새 창에서 크게 보기 ↗</a>
      <!-- src 는 탭을 처음 열 때 채운다 — 7편 그림 3.7MB -->
      <iframe class="comic" id="comicFrame" title="웅찌 만화 — 66원 사건" data-src="/shorts/detective/"></iframe>
    </div>
  </section>
</div>
<script>
(function () {
  var tabs = [].slice.call(document.querySelectorAll(".tab"));
  var frame = document.getElementById("comicFrame");
  var briefFrame = document.getElementById("briefFrame");
  // 같은 출처라 안쪽 문서 높이를 읽어 iframe 을 늘린다 — 안쪽 스크롤바 없이 페이지째 내려 읽게.
  function fitOne(f) {
    try {
      var doc = f.contentDocument;
      if (!doc || !doc.documentElement || f.offsetParent === null) return;   // 숨은 탭은 높이 0 이라 건너뛴다
      doc.documentElement.style.overflow = "hidden";
      f.style.height = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0) + "px";
    } catch (e) { /* 실패하면 min-height 로 남는다 */ }
  }
  function fit() { fitOne(frame); fitOne(briefFrame); }
  [frame, briefFrame].forEach(function (f) {
    f.addEventListener("load", function () {
      // 브리핑 페이지의 바깥 링크(← NUCLENS·스토리·자세한 뉴스)는 iframe 이 아니라 창째 이동.
      // 만화의 #ep 같은 같은 문서 안 링크는 그대로 둔다.
      if (f === briefFrame) {
        try {
          [].forEach.call(f.contentDocument.querySelectorAll("a[href]"), function (a) {
            if (a.getAttribute("href").charAt(0) !== "#") a.target = "_top";
            // 바깥 페이지에 「← NUCLENS」가 이미 있다 — 두 번 보이지 않게.
            if (a.getAttribute("href") === "/") a.style.visibility = "hidden";
          });
        } catch (e) { /* 링크는 iframe 안에서 열린다 */ }
      }
      fitOne(f);
      setTimeout(function () { fitOne(f); }, 800);   // 글꼴·그림이 늦게 붙으면 높이가 또 바뀐다
      setTimeout(function () { fitOne(f); }, 2500);
    });
  });
  window.addEventListener("resize", fit);
  // load 는 그림을 전부 받아야 온다(만화 3.7MB) — 폰에서는 그 전까지 위쪽만 보였다.
  // 받는 동안에도 0.7초마다 다시 잰다. 같은 출처 scrollHeight 읽기라 비용은 작다.
  setInterval(fit, 700);
  // 숨은 탭 안 iframe 의 영상까지 멈춘다.
  function pauseFrame(f) {
    try {
      [].forEach.call(f.contentDocument.querySelectorAll("video"), function (v) { if (!v.paused) v.pause(); });
    } catch (e) { /* 아직 안 열린 iframe */ }
  }
  function show(hash) {
    var found = tabs.some(function (t) { return t.getAttribute("data-hash") === hash; });
    if (!found) hash = "";
    tabs.forEach(function (t) {
      var on = t.getAttribute("data-hash") === hash;
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
    });
    // 숨겨진 탭의 영상은 멈춘다.
    [].forEach.call(document.querySelectorAll(".player"), function (v) {
      if (v.closest(".panel").hidden && !v.paused) v.pause();
    });
    if (hash !== "") pauseFrame(briefFrame);
    if (hash === "comic" && !frame.getAttribute("src")) frame.setAttribute("src", frame.getAttribute("data-src"));
    fit();   // 숨어 있다 보이게 된 iframe 은 그때 높이를 잰다
  }
  tabs.forEach(function (t) {
    t.addEventListener("click", function () {
      var h = t.getAttribute("data-hash");
      history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
      show(h);
    });
  });
  window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1));
})();
</script>
<script>
(function () {
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function len(sec) {
    sec = Number(sec) || 0;
    if (!sec) return "";
    if (sec < 60) return sec + "초";
    var s = sec % 60;
    return Math.floor(sec / 60) + "분 " + (s < 10 ? "0" + s : s) + "초";
  }
  function dateLabel(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d || ""));
    return m ? m[1] + ". " + m[2] + ". " + m[3] + "." : String(d || "");
  }
  // 공유 페이지가 있으면 그리로, 없으면 영상 파일(또는 유튜브)로.
  function href(row) {
    var page = String(row.page || "").trim();
    if (page) return "/shorts/" + encodeURIComponent(page) + "/";
    var yt = String(row.youtube || "").trim();
    if (yt) return "https://www.youtube.com/shorts/" + encodeURIComponent(yt);
    return "/shorts/" + encodeURIComponent(String(row.file || "").trim());
  }
  function poster(row) {
    var p = String(row.poster || "").trim();
    if (p) return "/shorts/" + encodeURIComponent(p);
    var yt = String(row.youtube || "").trim();
    return yt ? "https://i.ytimg.com/vi/" + encodeURIComponent(yt) + "/hqdefault.jpg" : "";
  }
  fetch("/shorts/index.json", { cache: "no-cache" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      // file·youtube 둘 다 비면 예약 줄 — app.js 의 shortsAll() 과 같은 규칙
      var rows = ((data && data.shorts) || []).filter(function (row) {
        return row && (String(row.file || "").trim() || String(row.youtube || "").trim());
      });
      // 최신이 위 — 줄 순서가 아니라 date·no (app.js 의 shortsLatest() 와 같은 규칙)
      rows.sort(function (a, b) {
        return String(b.date || "").localeCompare(String(a.date || ""))
          || (Number(b.no) || 0) - (Number(a.no) || 0);
      });
      var list = document.getElementById("list");
      if (!rows.length) { document.getElementById("empty").hidden = false; return; }
      // 최신 편은 공유 페이지(요약·공유·스토리 링크가 있는 원래 영상 브리핑 화면)를
      // 탭 안에 통째로 띄운다 — 눌러서 들어가지 않아도 바로 보이게(2026-10-29 지니).
      // 지난 편은 아래 목록으로 남는다.
      var latest = rows[0];
      var latestPage = String(latest.page || "").trim();
      if (latestPage) {
        rows = rows.slice(1);
        var brief = document.getElementById("briefFrame");
        brief.hidden = false;
        brief.setAttribute("title", "영상 브리핑 #" + latest.no + " — " + latest.title);
        brief.setAttribute("src", "/shorts/" + encodeURIComponent(latestPage) + "/");
        document.getElementById("briefLede").hidden = true;
      }
      list.innerHTML = rows.map(function (row) {
        var img = poster(row);
        var meta = [dateLabel(row.date), len(row.seconds)].filter(Boolean).join(" · ");
        return '<li><a class="ep" href="' + esc(href(row)) + '">'
          + '<div class="thumb">' + (img ? '<img src="' + esc(img) + '" alt="" loading="lazy">' : "")
          + '<span aria-hidden="true">&#9654;</span></div>'
          + '<div class="body"><p class="series">영상 브리핑 #' + esc(row.no) + '</p>'
          + '<h2>' + esc(row.title) + '</h2>'
          + (row.lead ? '<p class="lead">' + esc(row.lead) + '</p>' : "")
          + (meta ? '<p class="meta">' + esc(meta) + '</p>' : "")
          + '</div></a></li>';
      }).join("");
    })
    .catch(function () { document.getElementById("empty").hidden = false; });
})();
</script>
</body></html>
